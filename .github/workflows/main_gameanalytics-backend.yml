name: Build and deploy JAR app to Azure Web App - gameanalytics-backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install

      # VAADIN'IN ÜRETTİĞİ DOSYADAKİ WORKBOX HATASINI TEMİZLE
      - name: Patch Generated Vite File
        run: |
          if [ -f "vite.generated.ts" ]; then
            sed -i '/workbox-build/d' vite.generated.ts
            echo "Successfully removed workbox-build from vite.generated.ts"
          fi

      # Build with Maven
      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: '${{ github.workspace }}/target/*.jar'

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'gameanalytics-backend'
          slot-name: 'Production'
          package: '*.jar'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_1A788601CA394340B846FE30673B2A8B }}