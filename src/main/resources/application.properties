# Veritabani Baglantisi
spring.datasource.url=jdbc:postgresql://gameanalytics-db.postgres.database.azure.com:5432/postgres?sslmode=require
spring.datasource.username=postgresadmin
spring.datasource.password=GameAnalytics2026!

# Ortak JPA ve Hibernate Ayarları
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Istanbul

# SLF4J / Logging Ayarları
logging.level.root=INFO
logging.level.com.jollifiy.gameanalytics=INFO

# Port Ayari
server.port=8080

# EN KRITIK EKLEME: Vaadin Üretim Modu
vaadin.productionMode=true